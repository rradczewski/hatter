# Keep idle Bluetooth outputs open longer so headphones don't drop into
# power-save on short pauses (default is 5 seconds).
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 30
      }
    }
  }
]
