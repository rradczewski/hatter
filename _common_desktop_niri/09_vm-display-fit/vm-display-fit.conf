# Configuration for vm-display-fit.service (niri as a VM guest).
# The viewer's window size is divided by VM_FIT_FACTOR, capped at VM_FIT_MAX,
# and applied as a custom mode at scale 1.

# Divisor for the size the viewer requests. A GTK3 viewer on a fractionally
# scaled host (125%) renders at 2x and reports 2x the logical window size
# (e.g. 5504x2112 for a 2752x1056 window), so 2 yields the logical size.
VM_FIT_FACTOR=2
# Maximum guest mode, WxH
VM_FIT_MAX=2752x1152
# Refresh rate in Hz
VM_FIT_REFRESH=60
# Regex of output names to manage
VM_FIT_OUTPUTS=^Virtual-
