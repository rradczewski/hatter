name: Rotate base images
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}

jobs:
  rotate-base-images:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        image:
          - quay.io/fedora/fedora-silverblue:44-x86_64
          - quay.io/fedora/fedora-coreos:next
          - quay.io/fedora-ostree-desktops/cosmic-atomic:44
          - quay.io/fedora-ostree-desktops/base-atomic:44
    runs-on: ubuntu-latest
    steps:
      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install just --yes
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          registry: ${{ env.IMAGE_REGISTRY }}
      - run: |
          just rotate_base_image "${{ matrix.image }}"
