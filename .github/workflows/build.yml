name: Build hats
on:
  schedule:
    - cron: "0 0 * * 0"
  push:
  workflow_dispatch:

permissions:
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}

jobs:
  list-hats:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      matrix_not_empty: ${{ steps.check-matrix.outputs.matrix_not_empty }}
    steps:
      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install just --yes
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - run: git fetch origin main
      - id: set-matrix
        run: |
          set -euxo pipefail
          if [ "$GITHUB_REF" == "refs/heads/main" ]; then
            echo "matrix=$(just list-as-json list-hats)" | tee "$GITHUB_OUTPUT"
          else
            echo "matrix=$(just list-as-json list-changed-hats)" | tee "$GITHUB_OUTPUT"
          fi
      - id: check-matrix
        run: |
          set -euxo pipefail
          if echo '${{ steps.set-matrix.outputs.matrix }}' | jq -e '. | length > 0' > /dev/null 2>&1; then
            echo "matrix_not_empty=true" | tee -a "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" == "refs/heads/main" ]; then
            echo "::error::Empty matrix on main — this should never happen"
            exit 1
          else
            echo "matrix_not_empty=false" | tee -a "$GITHUB_OUTPUT"
          fi

  build-image:
    name: Build and push image
    needs: [list-hats]
    if: needs.list-hats.outputs.matrix_not_empty == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'main' || '' }}
    strategy:
        max-parallel: 1
        fail-fast: false
        matrix:
            hat: ${{ fromJson(needs.list-hats.outputs.matrix) }}

    outputs:
      registry-path: ${{ steps.push.outputs.registry-path }}
    steps:
      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install just --yes

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install cosign
        run: just setup-install-cosign

      - name: Install trunkver
        run: just setup-install-trunkver

      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Build image
        run: |
          just build "${{ matrix.hat }}"
        env:
          KERNEL_SIGNING_CERTIFICATE_PEM: ${{ secrets.KERNEL_SIGNING_CERTIFICATE_PEM }}
          KERNEL_SIGNING_CERTIFICATE_KEY: ${{ secrets.KERNEL_SIGNING_CERTIFICATE_KEY }}

      - name: Push Image
        if: github.ref == 'refs/heads/main'
        run: |
          just push "${{ matrix.hat }}"

      - name: Sign docker image
        if: github.ref == 'refs/heads/main'
        run: just sign "${{ matrix.hat }}"
